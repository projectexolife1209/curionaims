<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORIANA | AIIMS Raipur</title>

<meta name="description"
content="ORIANA — The annual college fest of AIIMS Raipur. A celebration of music, culture, sports, art and unforgettable memories.">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
rel="stylesheet">

<style>

:root{
    --bg:#050509;
    --cream:#f3eee4;
    --gold:#d9b36c;
    --purple:#7c5cff;
    --pink:#ff4fd8;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:var(--bg);
    color:white;
    font-family:'DM Sans',sans-serif;
    overflow-x:hidden;
}

/* -------------------------
   LOADING SCREEN
-------------------------- */

#loader{
    position:fixed;
    inset:0;
    background:#050509;
    z-index:9999;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .8s ease,visibility .8s ease;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-text{
    font-family:'Playfair Display',serif;
    font-size:clamp(3rem,12vw,9rem);
    letter-spacing:.15em;
    color:var(--cream);
    animation:loaderPulse 1.5s infinite alternate;
}

@keyframes loaderPulse{
    from{opacity:.3;transform:scale(.97)}
    to{opacity:1;transform:scale(1)}
}

/* -------------------------
   3D CANVAS
-------------------------- */

#canvas-container{
    position:fixed;
    inset:0;
    z-index:-2;
}

#three-canvas{
    width:100%;
    height:100%;
}

.noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    opacity:.035;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* -------------------------
   NAVBAR
-------------------------- */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:100;
    padding:20px 5vw;
    transition:.4s;
}

.navbar.scrolled{
    background:rgba(5,5,9,.72);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:'Playfair Display',serif;
    font-size:1.5rem;
    letter-spacing:.2em;
}

.nav-links{
    display:flex;
    gap:30px;
}

.nav-links a{
    color:rgba(255,255,255,.7);
    text-decoration:none;
    font-size:.82rem;
    letter-spacing:.12em;
    text-transform:uppercase;
    transition:.3s;
}

.nav-links a:hover{
    color:white;
}

.menu{
    display:none;
}

/* -------------------------
   HERO
-------------------------- */

.hero{
    min-height:100svh;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:120px 20px 80px;
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:1200px;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:8px 16px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:100px;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(10px);
    color:#c9c2b8;
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    margin-bottom:28px;
}

.dot{
    width:6px;
    height:6px;
    background:#d9b36c;
    border-radius:50%;
    box-shadow:0 0 15px #d9b36c;
}

.hero-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(5rem,17vw,15rem);
    line-height:.75;
    letter-spacing:-.07em;
    margin:0;
    font-weight:500;
}

.hero-title span{
    display:block;
    font-style:italic;
    font-size:.7em;
    margin-left:.5em;
    background:linear-gradient(
        120deg,
        #fff,
        #d9b36c,
        #fff,
        #9b7cff
    );
    background-size:300%;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    animation:gradientMove 8s infinite linear;
}

@keyframes gradientMove{
    0%{background-position:0%}
    100%{background-position:300%}
}

.hero-subtitle{
    margin:35px auto;
    max-width:600px;
    color:#aaa6a0;
    font-size:1rem;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 25px;
    border-radius:100px;
    text-decoration:none;
    font-size:.8rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    transition:.35s;
}

.btn-primary{
    background:#f1ece3;
    color:#080808;
}

.btn-primary:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(255,255,255,.15);
}

.btn-outline{
    border:1px solid rgba(255,255,255,.2);
    color:white;
    background:rgba(255,255,255,.04);
}

.btn-outline:hover{
    background:white;
    color:black;
}

/* floating card */

.floating-card{
    position:absolute;
    right:7%;
    top:35%;
    width:130px;
    height:170px;
    border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(15px);
    border-radius:20px;
    transform:rotate(9deg);
    padding:10px;
    animation:float 5s ease-in-out infinite;
}

.floating-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:12px;
}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(9deg)}
    50%{transform:translateY(-20px) rotate(5deg)}
}

/* -------------------------
   GENERAL
-------------------------- */

section{
    position:relative;
    padding:130px 6vw;
}

.container{
    max-width:1250px;
    margin:auto;
}

.section-label{
    color:#8d887f;
    text-transform:uppercase;
    font-size:.7rem;
    letter-spacing:.25em;
    margin-bottom:20px;
}

.section-title{
    font-family:'Playfair Display',serif;
    font-size:clamp(3rem,7vw,7rem);
    line-height:.95;
    font-weight:500;
    margin:0 0 40px;
    letter-spacing:-.04em;
}

.section-title em{
    color:#aaa39a;
}

/* -------------------------
   ABOUT
-------------------------- */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    align-items:center;
}

.about-text{
    color:#aaa6a0;
    font-size:1.05rem;
    line-height:2;
}

.about-image{
    height:550px;
    border-radius:30px;
    overflow:hidden;
    transform-style:preserve-3d;
    transition:transform .2s;
    border:1px solid rgba(255,255,255,.1);
}

.about-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .8s;
}

.about-image:hover img{
    transform:scale(1.05);
}

/* -------------------------
   EVENT CARDS
-------------------------- */

.events-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
}

.events-intro{
    max-width:450px;
    color:#89847d;
    line-height:1.8;
}

.event-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:60px;
}

.event-card{
    min-height:370px;
    padding:28px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.015)
    );
    backdrop-filter:blur(10px);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:.4s;
    transform-style:preserve-3d;
}

.event-card:hover{
    transform:translateY(-12px) rotateX(3deg) rotateY(-3deg);
    border-color:rgba(255,255,255,.3);
}

.event-number{
    font-size:.7rem;
    color:#7f7a72;
    letter-spacing:.15em;
}

.event-icon{
    font-size:3rem;
}

.event-card h3{
    font-family:'Playfair Display',serif;
    font-size:2rem;
    margin:0;
}

.event-card p{
    color:#88837c;
    font-size:.85rem;
    line-height:1.7;
}

/* -------------------------
   COUNTDOWN
-------------------------- */

.countdown-section{
    text-align:center;
    padding-top:100px;
    padding-bottom:100px;
}

.countdown{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:50px;
}

.time-box{
    width:130px;
    height:130px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    background:rgba(255,255,255,.035);
}

.time-box strong{
    font-family:'Manrope',sans-serif;
    font-size:3rem;
    font-weight:500;
}

.time-box span{
    font-size:.65rem;
    color:#77736d;
    letter-spacing:.2em;
    text-transform:uppercase;
}

/* -------------------------
   GALLERY
-------------------------- */

.gallery{
    display:grid;
    grid-template-columns:repeat(12,1fr);
    grid-auto-rows:100px;
    gap:12px;
}

.gallery-item{
    overflow:hidden;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.08);
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.6s;
}

.gallery-item:hover img{
    transform:scale(1.08);
}

.g1{grid-column:span 5;grid-row:span 4}
.g2{grid-column:span 3;grid-row:span 4}
.g3{grid-column:span 4;grid-row:span 3}
.g4{grid-column:span 4;grid-row:span 3}
.g5{grid-column:span 4;grid-row:span 3}
.g6{grid-column:span 4;grid-row:span 4}
.g7{grid-column:span 4;grid-row:span 4}
.g8{grid-column:span 4;grid-row:span 4}

/* -------------------------
   FLAGSHIP
-------------------------- */

.flagship{
    position:relative;
    overflow:hidden;
}

.flagship-card{
    min-height:600px;
    border-radius:35px;
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:end;
    padding:60px;
    background:
        linear-gradient(
            0deg,
            rgba(0,0,0,.9),
            transparent 70%
        ),
        url("1.png") center/cover;
    border:1px solid rgba(255,255,255,.1);
}

.flagship-content{
    max-width:700px;
}

.flagship-content h2{
    font-family:'Playfair Display',serif;
    font-size:clamp(3.5rem,8vw,8rem);
    line-height:.85;
    margin:0;
}

/* -------------------------
   MARQUEE
-------------------------- */

.marquee{
    padding:25px 0;
    overflow:hidden;
    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);
    white-space:nowrap;
}

.marquee-track{
    display:inline-block;
    animation:marquee 25s linear infinite;
}

.marquee span{
    font-family:'Playfair Display',serif;
    font-size:4rem;
    margin:0 30px;
    color:#aaa39a;
}

.marquee span:nth-child(even){
    color:white;
    font-style:italic;
}

@keyframes marquee{
    to{transform:translateX(-50%)}
}

/* -------------------------
   SPONSORS
-------------------------- */

.sponsors{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
}

.sponsor{
    height:130px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#66625c;
    font-size:.8rem;
    letter-spacing:.15em;
}

/* -------------------------
   FOOTER
-------------------------- */

footer{
    padding:100px 6vw 30px;
    border-top:1px solid rgba(255,255,255,.08);
}

.footer-main{
    display:flex;
    justify-content:space-between;
    gap:40px;
    align-items:end;
}

.footer-logo{
    font-family:'Playfair Display',serif;
    font-size:clamp(5rem,15vw,14rem);
    line-height:.7;
    letter-spacing:-.08em;
}

.footer-links{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.footer-links a{
    color:#77736d;
    text-decoration:none;
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.12em;
}

.footer-bottom{
    margin-top:100px;
    display:flex;
    justify-content:space-between;
    color:#55514c;
    font-size:.7rem;
}

/* -------------------------
   REVEAL ANIMATION
-------------------------- */

.reveal{
    opacity:0;
    transform:translateY(50px);
    transition:1s cubic-bezier(.2,.7,.2,1);
}

.reveal.visible{
    opacity:1;
    transform:none;
}

/* -------------------------
   RESPONSIVE
-------------------------- */

@media(max-width:900px){

    .nav-links{
        display:none;
    }

    .menu{
        display:block;
        background:none;
        border:0;
        color:white;
        font-size:1.5rem;
    }

    .floating-card{
        display:none;
    }

    .about-grid{
        grid-template-columns:1fr;
        gap:40px;
    }

    .
